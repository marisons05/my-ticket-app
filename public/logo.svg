<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Outer circle -->
  <circle cx="20" cy="20" r="19" stroke="url(#grad)" stroke-width="2"/>
  <!-- Equalizer bars (music/mix symbol) -->
  <rect x="9" y="18" width="4" height="10" rx="2" fill="url(#grad)"/>
  <rect x="16" y="12" width="4" height="16" rx="2" fill="url(#grad)"/>
  <rect x="23" y="15" width="4" height="13" rx="2" fill="url(#grad)"/>
  <rect x="30" y="20" width="4" height="8" rx="2" fill="url(#grad)"/>
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
</svg>
